<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Indicator</title>
</head>

<body>

    <h1>Student Exam Performance Indicator</h1>

    <h1>Student Exam Performance Prediction</h1>

    <br>

    <form action="/predictdata" method="post">

        <!-- Gender -->
        <label>Gender</label>

        <select name="gender">
            <option selected disabled>Select your Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <br>


        <!-- Race / Ethnicity -->
        <label>Race or Ethnicity</label>

        <select name="race_ethnicity">
            <option selected disabled>Select Ethnicity</option>
            <option value="group A">Group A</option>
            <option value="group B">Group B</option>
            <option value="group C">Group C</option>
            <option value="group D">Group D</option>
            <option value="group E">Group E</option>
        </select>

        <br>


        <!-- Parental Education -->
        <label>Parental Level of Education</label>

        <select name="parental_level_of_education">
            <option selected disabled>
                Select Parent Education
            </option>

            <option value="bachelor's degree">
                Bachelor's Degree
            </option>

            <option value="some college">
                Some College
            </option>

            <option value="master's degree">
                Master's Degree
            </option>

            <option value="associate's degree">
                Associate's Degree
            </option>

            <option value="high school">
                High School
            </option>

        </select>

        <br>


        <!-- Lunch -->
        <label>Lunch Type</label>

        <select name="lunch">
            <option selected disabled>Select Lunch Type</option>

            <option value="standard">
                Standard
            </option>

            <option value="free/reduced">
                Free/Reduced
            </option>

        </select>

        <br>


        <!-- Test Preparation -->
        <label>Test preparation Course</label>

        <select name="test_preparation_course">
            <option selected disabled>
                Select Test_course
            </option>

            <option value="none">None</option>

            <option value="completed">
                Completed
            </option>

        </select>

        <br>


        <!-- Writing Score -->
        <label>Writing Score out of 100</label>

        <input
            type="number"
            name="writing_score"
            placeholder="Enter your Writing Score"
        >

        <br>


        <!-- Reading Score -->
        <label>Reading Score out of 100</label>

        <input
            type="number"
            name="reading_score"
            placeholder="Enter your Reading Score"
        >

        <br>


        <!-- Button -->
        <input
            type="submit"
            value="Predict your Maths Score"
        >

    </form>


    <br>

    <h1>
        THE prediction is {{results}}
    </h1>

</body>
</html>
